name: Publish Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Coordinated npm release channel
        required: true
        type: choice
        options:
          - rc
          - stable
      version:
        description: Exact coordinated package version to confirm
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.version }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: true
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: test "$REF_NAME" = "$DEFAULT_BRANCH"

      - name: Checkout exact release source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js for trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: '24.11'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Pin trusted-publishing npm client
        run: npm install --global npm@11.6.2

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish and verify coordinated artifacts
        env:
          NPM_DIST_TAG_TOKEN: ${{ secrets.NPM_DIST_TAG_TOKEN }}
          NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: pnpm --filter xrpl-connect run "publish:${RELEASE_CHANNEL}" -- --confirm "$RELEASE_VERSION"

      - name: Create immutable source tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          tag="v${RELEASE_VERSION}"
          if git rev-parse --verify "refs/tags/${tag}" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "${tag}")" = "$GITHUB_SHA"
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag --annotate "$tag" --message "XRPL Connect ${RELEASE_VERSION}" "$GITHUB_SHA"
            git push origin "refs/tags/${tag}"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          tag="v${RELEASE_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            read -r actual_tag is_draft is_prerelease <<< \
              "$(gh release view "$tag" --json tagName,isDraft,isPrerelease --jq '[.tagName, .isDraft, .isPrerelease] | @tsv')"
            test "$actual_tag" = "$tag"
            expected_prerelease=false
            if test "$RELEASE_CHANNEL" = rc; then expected_prerelease=true; fi
            if test "$is_draft" != false || test "$is_prerelease" != "$expected_prerelease"; then
              if test "$RELEASE_CHANNEL" = rc; then
                gh release edit "$tag" --draft=false --prerelease
              else
                gh release edit "$tag" --draft=false --prerelease=false --latest
              fi
            fi
          elif test "$RELEASE_CHANNEL" = rc; then
            gh release create "$tag" --verify-tag --title "$tag" --generate-notes --prerelease
          else
            gh release create "$tag" --verify-tag --title "$tag" --generate-notes --latest
          fi

          read -r actual_tag is_draft is_prerelease <<< \
            "$(gh release view "$tag" --json tagName,isDraft,isPrerelease --jq '[.tagName, .isDraft, .isPrerelease] | @tsv')"
          test "$actual_tag" = "$tag"
          test "$is_draft" = false
          if test "$RELEASE_CHANNEL" = rc; then
            test "$is_prerelease" = true
          else
            test "$is_prerelease" = false
            if test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)" != "$tag"; then
              gh release edit "$tag" --latest
            fi
            test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)" = "$tag"
          fi

  deploy-docs:
    name: Deploy documentation for ${{ inputs.version }}
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy_vitepressDoc.yaml
    with:
      release_tag: v${{ inputs.version }}
