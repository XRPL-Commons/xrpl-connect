name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.19', '22.18', '24.11']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ matrix.node-version }}
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build
        run: vp run -r build

      - name: Test published package
        run: vp run -F xrpl-connect test:publish

      - name: Check
        run: vp check

      - name: Test
        run: vp run -F './packages/**' --ignore-depends-on --concurrency-limit 2 test -- --passWithNoTests

      - name: Install browser
        if: matrix.node-version == '24.11'
        run: vp exec playwright install --with-deps chromium

      - name: Browser tests
        if: matrix.node-version == '24.11'
        run: vp exec playwright test

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile --filter docs

      - name: Check versioned docs snapshot
        run: node docs/scripts/prepare-versioned-docs.mjs --check

      - name: Build docs
        run: vp run docs:build
