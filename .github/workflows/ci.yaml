name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.19', '22.18', '24.11']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          # Vite+ requires Node 22+, while published packages still support Node 20.
          node-version: ${{ matrix.node-version == '20.19' && '22.18' || matrix.node-version }}
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build
        run: vp run -r build

      - name: Build published packages
        run: |
          vp run -F xrpl-connect publish:build
          vp run -F @xrpl-commons/xrpl-connect-react -F @xrpl-commons/xrpl-connect-vue -F @xrpl-commons/xrpl-connect-privy --no-cache build

      - name: Check
        run: vp check

      - name: Test
        run: vp run -F './packages/**' --ignore-depends-on --concurrency-limit 2 test -- --passWithNoTests

      - name: Install browsers
        if: matrix.node-version == '24.11'
        run: vp exec playwright install --with-deps chromium webkit

      - name: Browser tests
        if: matrix.node-version == '24.11'
        run: vp exec playwright test

      - name: Setup Node 20 for consumer compatibility
        if: matrix.node-version == '20.19'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20.19'
          package-manager-cache: false

      - name: Test published packages on the consumer Node version
        run: node packages/xrpl-connect/scripts/test-publish.mjs

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: '24'
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile --filter docs

      - name: Check versioned docs snapshot
        run: node docs/scripts/prepare-versioned-docs.mjs --check

      - name: Build docs
        run: vp run docs:build
