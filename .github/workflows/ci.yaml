name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Build
        run: vp run -r build

      - name: Test published package
        run: vp run -F xrpl-connect test:publish

      - name: Check
        run: vp check

      - name: Test
        run: vp run -F './packages/**' --ignore-depends-on --concurrency-limit 2 test -- --passWithNoTests

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - name: Install dependencies
        run: vp install --filter docs

      - name: Build docs
        run: vp run docs:build
