name: Deploy VitePress site to Pages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published GitHub Release tag to deploy (for example v1.0.0)
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: Exact verified source tag to deploy
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Verify published release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Expected a stable or RC release tag, for example v1.0.0 or v1.0.0-rc.1"
            exit 1
          fi
          read -r actual_tag is_draft <<< \
            "$(gh release view "$RELEASE_TAG" --json tagName,isDraft --jq '[.tagName, .isDraft] | @tsv')"
          test "$actual_tag" = "$RELEASE_TAG"
          test "$is_draft" = false
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          cache: true
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Install dependencies
        run: vp install --frozen-lockfile --filter docs
      - name: Check versioned docs snapshot
        run: node docs/scripts/prepare-versioned-docs.mjs --check
      - name: Build with VitePress
        run: vp run docs:build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
